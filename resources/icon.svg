<?xml version="1.0" encoding="UTF-8"?>
<!--
  arraw app icon — the one source of truth (ADR 0013).
  A film sprocket-shaft arrow: two rows of perforations form the shaft,
  resolving into a teal chevron tip, on a charcoal tile.
  Edit this file, then regenerate the PNGs:  uv run tools/render_icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- charcoal rounded-square tile, matching the dark UI -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="#28282C"/>

  <!-- film sprocket-shaft: two rows of perforations (off-white) -->
  <g fill="#ECE8E0">
    <!-- top row -->
    <rect x="52"  y="88" width="16" height="26" rx="5"/>
    <rect x="76"  y="88" width="16" height="26" rx="5"/>
    <rect x="100" y="88" width="16" height="26" rx="5"/>
    <rect x="124" y="88" width="16" height="26" rx="5"/>
    <rect x="148" y="88" width="16" height="26" rx="5"/>
    <!-- bottom row -->
    <rect x="52"  y="142" width="16" height="26" rx="5"/>
    <rect x="76"  y="142" width="16" height="26" rx="5"/>
    <rect x="100" y="142" width="16" height="26" rx="5"/>
    <rect x="124" y="142" width="16" height="26" rx="5"/>
    <rect x="148" y="142" width="16" height="26" rx="5"/>
  </g>

  <!-- teal chevron tip: the arrowhead -->
  <polyline points="172,90 206,128 172,166"
            fill="none" stroke="#2DC6D6" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
