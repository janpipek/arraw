name: Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_BINARY_CACHE: C:\vcpkg\binary-cache
  VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg\binary-cache,readwrite
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_INSTALLED: C:\vcpkg\installed\x64-windows
  VCPKG_TOOLCHAIN: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
  VCVARS: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat

jobs:
  package:
    name: Build portable ZIP
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore only — the matching save steps run at the end with `if: always()`
      # so an expensive vcpkg build is cached even when a later step (e.g. the
      # sanity check) fails. actions/cache's built-in save is gated on job
      # success, which would discard the build on any failure.
      - name: Restore vcpkg downloads
        id: cache-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-windows-2022-${{ hashFiles('.github/workflows/windows-package.yml', 'CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-windows-2022-

      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\binary-cache
          key: vcpkg-binary-cache-windows-2022-${{ github.run_id }}
          restore-keys: |
            vcpkg-binary-cache-windows-2022-

      - name: Configure focused test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_BINARY_CACHE" | Out-Null
          $command = 'call "{0}" && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE="{1}" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="{2}" -DARRAW_VCPKG_INSTALLED="{2}" -DARRAW_WITH_LENSFUN=ON' -f $env:VCVARS, $env:VCPKG_TOOLCHAIN, $env:VCPKG_INSTALLED
          cmd /c $command
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build focused test binary
        shell: pwsh
        run: |
          $command = 'call "{0}" && cmake --build build --target arraw_tests' -f $env:VCVARS
          cmd /c $command
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run lensfun tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\build\tests\arraw_tests.exe "[lensfun]"

      - name: Build portable Windows ZIP and installer
        shell: pwsh
        run: |
          python tools/package_windows.py `
            --vcvars "$env:VCVARS" `
            --toolchain "$env:VCPKG_TOOLCHAIN" `
            --vcpkg-installed "$env:VCPKG_INSTALLED" `
            --installer

      - name: Sanity-check packaged tree
        shell: pwsh
        run: |
          $stage = Get-ChildItem -Path build-release\_package -Directory -Filter "arraw-*-windows-x64" |
            Select-Object -First 1
          if (-not $stage) {
            throw "Packaged staging directory was not found"
          }

          $exe = Join-Path $stage.FullName "arraw.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "arraw.exe is missing from the package"
          }

          $guiExe = Join-Path $stage.FullName "arraw-gui.exe"
          if (-not (Test-Path -LiteralPath $guiExe -PathType Leaf)) {
            throw "arraw-gui.exe is missing from the package"
          }

          $lensfunDll = Join-Path $stage.FullName "lensfun.dll"
          if (-not (Test-Path -LiteralPath $lensfunDll -PathType Leaf)) {
            throw "lensfun.dll is missing from the package"
          }

          $lensfunXml = Get-ChildItem -Path (Join-Path $stage.FullName "lensfun\db") -Filter "*.xml" -File -ErrorAction SilentlyContinue
          if (-not $lensfunXml) {
            throw "lensfun database XML files are missing from the package"
          }

          # arraw.exe is the console-subsystem command front-end (docs/adr/0049):
          # unlike arraw-gui.exe it waits and writes to stdout natively, so a plain
          # PowerShell native-command invocation captures it correctly - no
          # System.Diagnostics.Process dance or QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES
          # workaround needed, and no risk of the pipe-inheritance hang that a bare
          # `arraw.exe` (no args) invocation has via its detached `arraw-gui.exe` spawn.
          $versionOutput = (& $exe version) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "arraw.exe version failed with exit code $LASTEXITCODE"
          }
          $expectedVersion = $stage.Name -replace '^arraw-', '' -replace '-windows-x64$', ''
          $expected = "arraw $expectedVersion"
          if ($versionOutput.Trim() -ne $expected) {
            throw "arraw.exe version printed '$versionOutput', expected '$expected'"
          }
          Write-Host $versionOutput

          # Launch-only smoke of the GUI binary: prove it starts and stays up (no
          # missing-DLL/plugin failure) without asserting on window content or
          # capturing output, since arraw-gui.exe is GUI-subsystem and may render a
          # native dialog on error.
          $guiProc = Start-Process -FilePath $guiExe -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($guiProc.HasExited) {
              throw "arraw-gui.exe exited immediately (exit code $($guiProc.ExitCode))"
            }
          } finally {
            if (-not $guiProc.HasExited) {
              Stop-Process -Id $guiProc.Id -Force
            }
          }

          $zip = Get-ChildItem -Path dist -File -Filter "arraw-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Portable ZIP was not created"
          }

          $setup = Get-ChildItem -Path dist -File -Filter "arraw-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Installer was not created"
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-zip
          path: dist/arraw-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist/arraw-*-windows-x64-setup.exe
          if-no-files-found: error

      # Save the vcpkg caches even on failure so a partial or post-build break
      # never throws away the multi-hour dependency build. Keys must match the
      # restore steps above. The downloads save is skipped on an exact-key hit
      # to avoid a redundant "cache already exists" warning; the binary cache is
      # keyed on the unique run_id, so it always writes a fresh entry that later
      # runs pick up via the restore-keys prefix.
      - name: Save vcpkg downloads
        if: always() && steps.cache-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-windows-2022-${{ hashFiles('.github/workflows/windows-package.yml', 'CMakeLists.txt', 'vcpkg.json') }}

      - name: Save vcpkg binary packages
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\binary-cache
          key: vcpkg-binary-cache-windows-2022-${{ github.run_id }}
