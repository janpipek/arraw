name: Release
run-name: Release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string
      build_appimage:
        description: Build the Linux AppImage
        required: true
        default: false
        type: boolean
      build_fedora_rpm:
        description: Build the Fedora 44 RPM and SRPM
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: Replace same-named assets on a mutable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require dispatch from the default branch
        env:
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DISPATCH_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Dispatch this workflow from $DEFAULT_BRANCH, not $DISPATCH_REF"
            exit 1
          fi

      - name: Require at least one build target
        env:
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_FEDORA_RPM: ${{ inputs.build_fedora_rpm }}
        run: |
          if [ "$BUILD_APPIMAGE" != true ] && [ "$BUILD_FEDORA_RPM" != true ]; then
            echo "::error::Select at least one release artifact"
            exit 1
          fi

      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must have the form vX.Y.Z"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, CMake, and RPM versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          cmake_version="$(sed -nE 's/^project\(arraw VERSION ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt)"
          rpm_version="$(sed -nE 's/^Version:[[:space:]]+([^[:space:]]+).*$/\1/p' packaging/fedora/arraw.spec)"
          echo "tag=$tag_version cmake=$cmake_version rpm=$rpm_version"
          if [ "$tag_version" != "$cmake_version" ] || [ "$tag_version" != "$rpm_version" ]; then
            echo "::error::Release tag, CMake version, and RPM version must agree"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  linux-appimage:
    name: Build Linux AppImage
    if: inputs.build_appimage
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file appstream libdbus-1-3 \
            libraw-dev liblcms2-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/linux/io.github.janpipek.arraw.metainfo.xml

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARRAW_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          ninja -C build arraw

      - name: Stage AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          NO_STRIP: '1'
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          OUTPUT: arraw-${{ needs.validate.outputs.version }}-x86_64.AppImage
        run: |
          base="https://github.com/linuxdeploy"
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: arraw-*.AppImage
          if-no-files-found: error

  appimage-smoke:
    name: Smoke-test AppImage on Ubuntu 24.04
    if: inputs.build_appimage
    needs: [validate, linux-appimage]
    runs-on: ubuntu-24.04
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage

      - name: Install AppImage host baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx0 libopengl0 libegl1 libglvnd0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxrender1 libxext6 libxi6 libxfixes3 libsm6 libice6

      - name: Run AppImage offscreen
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x arraw-*.AppImage
          ./arraw-*.AppImage --version | grep -q '^arraw '

  fedora-rpm:
    name: Build Fedora 44 RPM
    if: inputs.build_fedora_rpm
    needs: validate
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install Fedora packaging dependencies
        run: |
          dnf install -y \
            appstream catch-devel cmake desktop-file-utils findutils gcc-c++ git gzip \
            lcms2-devel LibRaw-devel ninja-build qt6-qtbase-devel \
            qt6-qtbase-private-devel qt6-qtimageformats qt6-qtshadertools-devel \
            redhat-rpm-config rpm-build rpmlint

      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/package_fedora.sh

      - name: Upload Fedora package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpms
          path: |
            dist/fedora/*.rpm
            dist/fedora/SHA256SUMS
            dist/fedora/BINARY_RPM
          if-no-files-found: error

  fedora-smoke:
    name: Smoke-test RPM on clean Fedora 44
    if: inputs.build_fedora_rpm
    needs: [validate, fedora-rpm]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Download Fedora packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-rpms
          path: fedora-rpms

      - name: Install and verify RPM
        run: |
          rpm_name="$(cat fedora-rpms/BINARY_RPM)"
          dnf install -y --setopt=install_weak_deps=False \
            desktop-file-utils glib2 "fedora-rpms/$rpm_name"
          QT_QPA_PLATFORM=offscreen arraw --version | grep -q '^arraw '
          desktop-file-validate \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          grep -q 'image/x-canon-cr3' \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          grep -q 'image/webp' \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          gio mime image/x-canon-cr3 | grep -q io.github.janpipek.arraw.desktop

  attest:
    name: Prepare and attest release artifacts
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (inputs.build_appimage == false || needs.appimage-smoke.result == 'success') &&
      (inputs.build_fedora_rpm == false || needs.fedora-smoke.result == 'success')
    needs: [validate, appimage-smoke, fedora-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token / attestations writes are only needed for the attestation step,
      # which is disabled while the repo is private (see "Generate build-provenance
      # attestations" below). Re-enable both when turning attestations back on.
      # id-token: write
      # attestations: write
    steps:
      - name: Download AppImage
        if: inputs.build_appimage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage
          path: appimage

      - name: Download Fedora packages
        if: inputs.build_fedora_rpm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-rpms
          path: fedora-rpms

      - name: Select public release artifacts
        env:
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_FEDORA_RPM: ${{ inputs.build_fedora_rpm }}
        run: |
          mkdir release-assets
          if [ "$BUILD_APPIMAGE" = true ]; then
            cp appimage/arraw-*.AppImage release-assets/
          fi
          if [ "$BUILD_FEDORA_RPM" = true ]; then
            rpm_name="$(cat fedora-rpms/BINARY_RPM)"
            cp "fedora-rpms/$rpm_name" release-assets/
            cp fedora-rpms/arraw-*.src.rpm release-assets/
          fi
          cd release-assets
          sha256sum arraw-* >SHA256SUMS

      # TODO: re-enable build-provenance attestations once the repo is public.
      # Attestations require a public repo (or GitHub Advanced Security) to be
      # publicly verifiable, so this step is disabled while the repo is private.
      - name: Generate build-provenance attestations
        if: false
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-assets/*

      - name: Upload attested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: attest
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download attested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Refuse implicit asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing_assets }}
        run: |
          existing="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[].name' 2>/dev/null || true)"
          if [ "$REPLACE_EXISTING" != true ]; then
            while IFS= read -r path; do
              name="$(basename "$path")"
              if grep -Fxq "$name" <<<"$existing"; then
                echo "::error::Release asset '$name' already exists; explicitly allow replacement to overwrite it"
                exit 1
              fi
            done < <(find release-assets -maxdepth 1 -type f -print)
          fi

      - name: Publish selected assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: ${{ inputs.replace_existing_assets }}
