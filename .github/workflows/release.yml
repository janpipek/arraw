name: Release
run-name: Release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string
      build_appimage:
        description: Build the Linux AppImage
        required: true
        default: false
        type: boolean
      build_fedora_rpm:
        description: Build the Fedora 44 RPM and SRPM
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: Replace same-named assets on a mutable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require dispatch from the default branch
        env:
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DISPATCH_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Dispatch this workflow from $DEFAULT_BRANCH, not $DISPATCH_REF"
            exit 1
          fi

      - name: Require at least one build target
        env:
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_FEDORA_RPM: ${{ inputs.build_fedora_rpm }}
        run: |
          if [ "$BUILD_APPIMAGE" != true ] && [ "$BUILD_FEDORA_RPM" != true ]; then
            echo "::error::Select at least one release artifact"
            exit 1
          fi

      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must have the form vX.Y.Z"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, CMake, and RPM versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          cmake_version="$(sed -nE 's/^project\(arraw VERSION ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt)"
          rpm_version="$(sed -nE 's/^Version:[[:space:]]+([^[:space:]]+).*$/\1/p' packaging/fedora/arraw.spec)"
          echo "tag=$tag_version cmake=$cmake_version rpm=$rpm_version"
          if [ "$tag_version" != "$cmake_version" ] || [ "$tag_version" != "$rpm_version" ]; then
            echo "::error::Release tag, CMake version, and RPM version must agree"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  linux-appimage:
    name: Build Linux AppImage
    if: inputs.build_appimage
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Install system build dependencies
        # Package list shared with packaging/linux/Containerfile (apt-build-deps.txt)
        # so the two AppImage build paths can't drift.
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' packaging/linux/apt-build-deps.txt \
            | xargs sudo apt-get install -y --no-install-recommends

      - name: Build AppImage
        # Single source of truth shared with `just appimage` (build-appimage.sh):
        # validate metainfo → cmake build → stage AppDir → stage lensfun DB →
        # linuxdeploy. ARRAW_* map the script's container defaults onto the runner;
        # QT_ROOT_DIR (from install-qt-action) is the Qt prefix; no /dist here, so
        # the AppImage is left in the workspace for the upload step to pick up.
        env:
          ARRAW_SRC: ${{ github.workspace }}
          ARRAW_BUILD_DIR: ${{ github.workspace }}/build
          ARRAW_APPDIR: ${{ github.workspace }}/AppDir
        run: bash packaging/linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: arraw-*.AppImage
          if-no-files-found: error

  appimage-smoke:
    name: Smoke-test AppImage on Ubuntu 24.04
    if: inputs.build_appimage
    needs: [validate, linux-appimage]
    runs-on: ubuntu-24.04
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage

      - name: Install AppImage host baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx0 libopengl0 libegl1 libglvnd0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxrender1 libxext6 libxi6 libxfixes3 libsm6 libice6

      - name: Verify lensfun is bundled
        # Prove lens correction actually shipped: the library (linuxdeploy) and the
        # lens DB (our staging step) must both be inside the AppImage (#53).
        run: |
          chmod +x arraw-*.AppImage
          ./arraw-*.AppImage --appimage-extract >/dev/null
          if ! ls squashfs-root/usr/lib/liblensfun*.so* >/dev/null 2>&1; then
            echo "::error::liblensfun is not bundled in the AppImage"
            exit 1
          fi
          if [ -z "$(ls -A squashfs-root/usr/share/lensfun/db/*.xml 2>/dev/null)" ]; then
            echo "::error::lensfun database is not bundled in the AppImage"
            exit 1
          fi
          rm -rf squashfs-root

      - name: Run AppImage offscreen
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x arraw-*.AppImage
          ./arraw-*.AppImage --version | grep -q '^arraw '

  fedora-rpm:
    name: Build Fedora 44 RPM
    if: inputs.build_fedora_rpm
    needs: validate
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install Fedora packaging dependencies
        run: |
          dnf install -y \
            appstream catch-devel cmake desktop-file-utils exiv2-devel findutils gcc-c++ git gzip \
            lcms2-devel lensfun-devel LibRaw-devel ninja-build qt6-qtbase-devel \
            qt6-qtbase-private-devel qt6-qtimageformats qt6-qtshadertools-devel \
            redhat-rpm-config rpm-build rpmlint

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/package_fedora.sh

      - name: Upload Fedora package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpms
          path: |
            dist/fedora/*.rpm
            dist/fedora/SHA256SUMS
            dist/fedora/BINARY_RPM
          if-no-files-found: error

  fedora-smoke:
    name: Smoke-test RPM on clean Fedora 44
    if: inputs.build_fedora_rpm
    needs: [validate, fedora-rpm]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Download Fedora packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-rpms
          path: fedora-rpms

      - name: Install and verify RPM
        run: |
          rpm_name="$(cat fedora-rpms/BINARY_RPM)"
          dnf install -y --setopt=install_weak_deps=False \
            desktop-file-utils glib2 "fedora-rpms/$rpm_name"
          QT_QPA_PLATFORM=offscreen arraw --version | grep -q '^arraw '
          desktop-file-validate \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          grep -q 'image/x-canon-cr3' \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          grep -q 'image/webp' \
            /usr/share/applications/io.github.janpipek.arraw.desktop
          gio mime image/x-canon-cr3 | grep -q io.github.janpipek.arraw.desktop

  attest:
    name: Prepare and attest release artifacts
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (inputs.build_appimage == false || needs.appimage-smoke.result == 'success') &&
      (inputs.build_fedora_rpm == false || needs.fedora-smoke.result == 'success')
    needs: [validate, appimage-smoke, fedora-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token / attestations writes are only needed for the attestation step,
      # which is disabled while the repo is private (see "Generate build-provenance
      # attestations" below). Re-enable both when turning attestations back on.
      # id-token: write
      # attestations: write
    steps:
      - name: Download AppImage
        if: inputs.build_appimage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage
          path: appimage

      - name: Download Fedora packages
        if: inputs.build_fedora_rpm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-rpms
          path: fedora-rpms

      - name: Select public release artifacts
        env:
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_FEDORA_RPM: ${{ inputs.build_fedora_rpm }}
        run: |
          mkdir release-assets
          if [ "$BUILD_APPIMAGE" = true ]; then
            cp appimage/arraw-*.AppImage release-assets/
          fi
          if [ "$BUILD_FEDORA_RPM" = true ]; then
            rpm_name="$(cat fedora-rpms/BINARY_RPM)"
            cp "fedora-rpms/$rpm_name" release-assets/
            cp fedora-rpms/arraw-*.src.rpm release-assets/
          fi
          cd release-assets
          sha256sum arraw-* >SHA256SUMS

      # TODO: re-enable build-provenance attestations once the repo is public.
      # Attestations require a public repo (or GitHub Advanced Security) to be
      # publicly verifiable, so this step is disabled while the repo is private.
      - name: Generate build-provenance attestations
        if: false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload attested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: attest
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download attested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Refuse implicit asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing_assets }}
        run: |
          existing="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[].name' 2>/dev/null || true)"
          if [ "$REPLACE_EXISTING" != true ]; then
            while IFS= read -r path; do
              name="$(basename "$path")"
              if grep -Fxq "$name" <<<"$existing"; then
                echo "::error::Release asset '$name' already exists; explicitly allow replacement to overwrite it"
                exit 1
              fi
            done < <(find release-assets -maxdepth 1 -type f -print)
          fi

      - name: Publish selected assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: ${{ inputs.replace_existing_assets }}
