name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Qt 6.10, Debug)
    runs-on: ubuntu-24.04
    env:
      # No test needs a display yet; keep it offscreen so that stays true by
      # default once GUI tests arrive.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build catch2 libgl1-mesa-dev libvulkan-dev libxkbcommon-dev \
            libraw-dev libtiff6

      # Ubuntu 24.04 ships Qt 6.4; arraw requires 6.10.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug
