name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Qt 6.10, Debug)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # The same list the dev sandbox image installs (tools/sandbox/Containerfile).
      # Ubuntu 26.04 ships Qt 6.10, and Mesa's lavapipe runs the Vulkan tests.
      - name: Install build dependencies
        run: sudo tools/ci/install-deps.sh

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      # arraw-gpu-tests is part of the build and registered with ctest; it picks
      # its own headless platform, so no QT_QPA_PLATFORM is needed here, and
      # lavapipe stands in for a GPU (the device tests skip without Vulkan).
      - name: Test
        run: ctest --preset debug
