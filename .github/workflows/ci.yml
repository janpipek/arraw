name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Qt 6.10, Debug)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # The same list the dev sandbox image installs (tools/sandbox/Containerfile).
      # Ubuntu 26.04 ships Qt 6.10, and Mesa's lavapipe runs the Vulkan tests.
      - name: Install build dependencies
        run: sudo tools/ci/install-deps.sh

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      # arraw-gpu-tests is part of the build and registered with ctest; it picks
      # its own headless platform, so no QT_QPA_PLATFORM is needed here, and
      # lavapipe stands in for a GPU (the device tests skip without Vulkan).
      - name: Test
        run: ctest --preset debug -j "$(nproc)"

  python:
    name: Python bindings (Qt 6.10, Debug)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo tools/ci/install-deps.sh

      # uv provides the managed Python (with headers) the extension builds
      # against; just runs the same recipe as a developer does.
      - uses: astral-sh/setup-uv@v5

      - name: Install just
        run: sudo apt-get install -y --no-install-recommends just

      # Builds the _arraw module and arraw-cli (the parity tests compare the two),
      # then runs pytest with ARRAW_REQUIRE_CLI=1, so a missing CLI fails
      # instead of skipping.
      - name: Test
        run: just py-test
